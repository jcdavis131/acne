name: publish
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build
          python -m build --wheel --sdist
          ls -lh dist/
      - name: Verify wheel
        run: |
          python - << 'PY'
          import zipfile, pathlib
          whl = next(pathlib.Path("dist").glob("*.whl"))
          print(f"wheel {whl}")
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              assert not any("memory" in n or ".agentic-contacts" in n for n in names), "wheel leaks"
              assert any("acne" in n for n in names)
              print(f"{len(names)} files ok")
          PY
      - name: Test wheel
        run: |
          pip install dist/*.whl
          pytest -q
      - name: Publish to PyPI (trusted publisher)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
