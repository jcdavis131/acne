[project]
name = "acne"
version = "0.2.1"
description = "ACNE — Agentic Contacts – Named Entities. Local-first people memory for agentic harnesses."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cameron Davis + Scout"}]
keywords = ["agents", "harness", "contacts", "named-entities", "tlpg", "graphrag", "token-cache"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio"]
langchain = ["langchain-core>=0.3", "langchain>=0.3"]
crewai = ["crewai>=0.70"]
openai = ["openai>=1.0"]
all = ["langchain-core>=0.3", "langchain>=0.3", "crewai>=0.70", "openai>=1.0"]

[project.urls]
Homepage = "https://github.com/jcdavis131/acne"
Changelog = "https://github.com/jcdavis131/acne/releases"
Issues = "https://github.com/jcdavis131/acne/issues"
Source = "https://github.com/jcdavis131/acne"

[project.scripts]
acne = "acne.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
